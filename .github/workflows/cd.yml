name: CI/CD SBD Platform

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dochau1509/sbd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./project_SBD
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          ENV_PATH: ${{ vars.ENV_FILE_PATH }}
          HOST_PORT: ${{ vars.HOST_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            echo "1. Đăng nhập GHCR bằng GITHUB_TOKEN mặc định..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "2. Kéo Image nhánh ${IMAGE_TAG} về..."
            docker pull $IMAGE_TAG
            
            echo "3. Xóa container cũ (nếu có)..."
            docker stop sbd_app 2>/dev/null || true
            docker rm sbd_app 2>/dev/null || true
            
            echo "4. Chạy Container mới..."
            docker run -d \
              --name sbd_app \
              --restart unless-stopped \
              -p "0.0.0.0:$HOST_PORT:8000" \
              --env-file "$ENV_PATH" \
              "$IMAGE_TAG"
            
            echo "🚀 Deploy thành công!"
          EOF
