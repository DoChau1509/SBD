{% extends 'base.html' %}
{% block content %}
<div class="container" style="margin-top:110px; max-width: 540px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <h3 class="mb-1" style="color:var(--primary); font-weight:800;">Quên mật khẩu</h3>
                <div class="text-muted">Nhập tên đăng nhập hoặc email để nhận mã OTP qua email.</div>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">{{ form.identifier.label }}</label>
                    {{ form.identifier }}
                    {% if form.identifier.errors %}<div class="text-danger small mt-1">{{ form.identifier.errors }}</div>{% endif %}
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Gửi mã OTP</button>
            </form>

            <div class="text-center small text-muted mt-3 mb-0">
                Nhớ lại mật khẩu?
                <a href="{% url 'login' %}" class="fw-semibold text-decoration-none">Đăng nhập</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
