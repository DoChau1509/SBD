{% extends 'base.html' %}
{% block content %}

<div class="container" style="margin-top:100px; max-width:700px;">

    <h2>{% if post %}Sửa{% else %}Thêm{% endif %} Bài Viết</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="text" name="title"
               value="{{ post.title|default:'' }}"
               placeholder="Tiêu đề bài viết"
               class="form-control mb-2"
               required>

        <textarea name="summary"
                  class="form-control mb-2"
                  rows="3"
                  placeholder="Mô tả ngắn / tóm tắt bài viết">{{ post.summary|default:'' }}</textarea>

        <textarea name="content"
                  class="form-control mb-2"
                  rows="10"
                  placeholder="Nội dung chi tiết bài viết"
                  required>{{ post.content|default:'' }}</textarea>

        <select name="category" class="form-control mb-2" required>
            <option value="" disabled {% if not post %}selected{% endif %}>-- Chọn danh mục --</option>
            {% for c in categories %}
                <option value="{{ c.id }}" {% if post and post.category_id == c.id %}selected{% endif %}>
                    {{ c.name }}
                </option>
            {% endfor %}
        </select>

        <input type="file" name="image" class="form-control mb-2">

        {% if post.image %}
            <img src="{{ post.image.url }}" width="140" alt="{{ post.title }}">
        {% endif %}

        <div class="d-flex justify-content-between align-items-center mt-2">
            <a href="{% url 'post_list' %}" class="btn btn-secondary">Quay lại</a>
            <button class="btn btn-primary">Lưu</button>
        </div>

    </form>

</div>

{% endblock %}
