{% extends 'base.html' %}
{% block content %}

<div class="container" style="margin-top: 100px; max-width: 900px">
  <h2 class="fw-bold mb-4">{{ title }}</h2>

  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-group mb-3">
      <label>Tên nút *</label>
      <input
        type="text"
        name="title"
        class="form-control"
        value="{{ button.title|default:'' }}"
        placeholder="Ví dụ: Zalo, Hotline, Messenger..."
        required
      >
    </div>

    <div class="form-group mb-3">
      <label>Kiểu hành động *</label>
      <select name="action_type" id="floating-action-type" class="form-control" required>
        {% for value, label in action_choices %}
        <option value="{{ value }}" {% if button.action_type == value or not button and value == 'link' %}selected{% endif %}>
          {{ label }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group mb-3" data-floating-field="link">
      <label>Đường link</label>
      <input
        type="url"
        name="link_url"
        class="form-control"
        value="{{ button.link_url|default:'' }}"
        placeholder="https://zalo.me/... hoặc https://m.me/..."
      >
    </div>

    <div class="form-group mb-3" data-floating-field="info">
      <label>Thông tin hiển thị</label>
      <textarea
        name="info_text"
        class="form-control"
        rows="5"
        placeholder="Ví dụ: Hotline: 0900 000 000&#10;Email: contact@example.com"
      >{{ button.info_text|default:'' }}</textarea>
    </div>

    <div class="form-group mb-3">
      <label>Hình ảnh nút {% if not button.id %}*{% endif %}</label>
      <input type="file" name="image" class="form-control" accept="image/*" {% if not button.id %}required{% endif %}>
      {% if button.image %}
      <div class="mt-3 d-flex align-items-center gap-3">
        <img src="{{ button.image.url }}" alt="{{ button.title }}" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover;">
        <span class="text-muted small">Ảnh hiện tại. Tải ảnh mới nếu muốn thay đổi.</span>
      </div>
      {% endif %}
    </div>

    <div class="form-group mb-3">
      <label>Thứ tự</label>
      <input
        type="number"
        name="order"
        class="form-control"
        value="{{ button.order|default:'0' }}"
        min="0"
      >
    </div>

    <div class="form-group form-check mb-4">
      <input
        type="checkbox"
        name="is_active"
        class="form-check-input"
        id="floating_is_active"
        {% if button.is_active or not button %}checked{% endif %}
      >
      <label class="form-check-label" for="floating_is_active">
        Hiển thị trên website
      </label>
    </div>

    <button type="submit" class="btn btn-primary">Lưu</button>
    <a href="{% url 'floating_contact_button_list' %}" class="btn btn-secondary">Hủy</a>
  </form>
</div>

<script>
  (function () {
    var select = document.getElementById("floating-action-type");
    var linkField = document.querySelector("[data-floating-field='link']");
    var infoField = document.querySelector("[data-floating-field='info']");

    if (!select || !linkField || !infoField) return;

    function syncFields() {
      var isInfo = select.value === "info";
      linkField.style.display = isInfo ? "none" : "";
      infoField.style.display = isInfo ? "" : "none";
    }

    select.addEventListener("change", syncFields);
    syncFields();
  })();
</script>

{% endblock %}
