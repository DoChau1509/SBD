{% extends 'base.html' %} {% block content %}
<div class="container" style="margin-top: 100px; max-width: 800px">
  <h2>{{ title }}</h2>

  <form method="POST">
    {% csrf_token %}

    <input
      type="text"
      name="section_title"
      class="form-control mb-3"
      value="{{ section.section_title|default:'' }}"
      placeholder="Tiêu đề bên trái"
    />

    <input
      type="text"
      name="right_kicker"
      class="form-control mb-3"
      value="{{ section.right_kicker|default:'' }}"
      placeholder="Dòng nhỏ bên phải"
    />

    <input
      type="text"
      name="right_title"
      class="form-control mb-3"
      value="{{ section.right_title|default:'' }}"
      placeholder="Tiêu đề lớn bên phải"
    />

    <input
      type="text"
      name="right_subtitle"
      class="form-control mb-3"
      value="{{ section.right_subtitle|default:'' }}"
      placeholder="Dòng mô tả bên phải"
    />

    <input
      type="text"
      name="badge_number"
      class="form-control mb-3"
      value="{{ section.badge_number|default:'' }}"
      placeholder="Ví dụ: 15+"
    />

    <input
      type="text"
      name="badge_label"
      class="form-control mb-3"
      value="{{ section.badge_label|default:'' }}"
      placeholder="Ví dụ: Năm Kinh Nghiệm"
    />

    <div class="d-flex justify-content-between">
      <a href="{% url 'why_choose_item_list' %}" class="btn btn-secondary"
        >Quay lại</a
      >
      <button type="submit" class="btn btn-primary">Lưu</button>
    </div>
  </form>
</div>
{% endblock %}
