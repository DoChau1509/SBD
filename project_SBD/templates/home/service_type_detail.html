{% extends 'base.html' %}

{% block content %}
<section class="section-top">
  <div class="container">
    <div class="col-lg-10 offset-lg-1 col-xs-12 text-center">
      <div class="section-top-title wow fadeInRight" data-wow-duration="1s" data-wow-delay="0.3s">
        <h1>{{ service_type.name }}</h1>
        <div class="breadcrumb-nav">
          <a href="{% url 'home' %}">Trang Chủ</a>
          <span>/</span>
          <a href="{% url 'home' %}#services">Dịch vụ</a>
          <span>/</span>
          <strong>{{ service_type.name }}</strong>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="services-section">
  <div class="container">
    <div class="row g-5">
      {% for service in services %}
      <div class="col-lg-4 col-md-6">
        <article class="service-card wow fadeInUp">
          <div class="service-icon">
            <i class="{{ service.icon_css_class }}"></i>
          </div>
          <h4>{{ service.title }}</h4>
          <p>{{ service.content }}</p>
          <a href="{% url 'service_detail' service.id %}" class="btn btn-sm btn-outline-primary mt-2">Xem chi tiết</a>
        </article>
      </div>
      {% empty %}
      <div class="col-12 text-center">
        <p class="mb-0 text-muted">Nội dung cho loại dịch vụ này đang được cập nhật.</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
