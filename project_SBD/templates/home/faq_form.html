{% extends 'base.html' %}
{% block content %}
<div class="container" style="margin-top:100px;">
    <h2>{{ title }}</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Câu hỏi *</label>
            <input type="text" name="question" class="form-control"
                   value="{{ faq.question|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Câu trả lời *</label>
            <textarea name="answer" class="form-control" rows="5" required>{{ faq.answer|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label>Thứ tự hiển thị</label>
            <input type="number" name="order" class="form-control"
                   value="{{ faq.order|default:'0' }}" min="0">
        </div>
        <div class="form-group form-check">
            <input type="checkbox" name="is_active" class="form-check-input" id="is_active"
                   {% if faq.is_active or not faq %}checked{% endif %}>
            <label class="form-check-label" for="is_active">Hiển thị trên website</label>
        </div>
        <button type="submit" class="btn btn-primary">Lưu</button>
        <a href="{% url 'faq_list' %}" class="btn btn-secondary">Hủy</a>
    </form>
</div>
{% endblock %}
