{% extends 'base.html' %} {% block content %}
<div class="container" style="margin-top: 100px; max-width: 900px">
  <h2>{{ title }}</h2>

  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="form-group">
      <label>Tên loại *</label>
      <input
        type="text"
        name="name"
        class="form-control"
        value="{{ statement_type.name|default:'' }}"
        placeholder="Ví dụ: Tầm nhìn, Sứ mệnh, Giá trị cốt lõi, Kiến thức"
        required
      />
    </div>

    <div class="form-group">
      <label>Thứ tự hiển thị</label>
      <input
        type="number"
        name="order"
        class="form-control"
        value="{{ statement_type.order|default:'0' }}"
        min="0"
      />
    </div>

    <div class="form-group form-check">
      <input
        type="checkbox"
        name="is_active"
        class="form-check-input"
        id="is_active_type"
        {%
        if
        statement_type.is_active
        or
        not
        statement_type
        %}checked{%
        endif
        %}
      />
      <label class="form-check-label" for="is_active_type">
        Hiển thị trong danh sách chọn
      </label>
    </div>

    <button type="submit" class="btn btn-primary">Lưu</button>
    <a href="{% url 'statement_type_list' %}" class="btn btn-secondary">Hủy</a>
  </form>
</div>
{% endblock %}
