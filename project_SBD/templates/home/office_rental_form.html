{% extends 'base.html' %}
{% block content %}

<div class="container" style="margin-top:100px; max-width:700px;">
  <h2>{% if office_rental %}Sửa{% else %}Thêm{% endif %} thông tin cho thuê văn phòng</h2>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="text" name="title" value="{{ office_rental.title|default:'' }}" placeholder="Tên văn phòng" class="form-control mb-2" required>

    <textarea name="summary" class="form-control mb-2" rows="3" placeholder="Mô tả ngắn">{{ office_rental.summary|default:'' }}</textarea>

    <textarea name="content" class="form-control mb-2" rows="8" placeholder="Thông tin chi tiết" required>{{ office_rental.content|default:'' }}</textarea>

    <div class="row">
      <div class="col-md-6">
        <input type="number" step="0.01" min="0" name="area" value="{{ office_rental.area|default:'' }}" placeholder="Diện tích (m2)" class="form-control mb-2" required>
      </div>
      <div class="col-md-6">
        <input type="number" step="1" min="0" name="rent_price" value="{{ office_rental.rent_price|default:'' }}" placeholder="Giá thuê (VNĐ)" class="form-control mb-2" required>
      </div>
    </div>

    {% include "includes/gallery_form_field.html" with instance=office_rental %}

    <div class="d-flex justify-content-between align-items-center mt-3">
      <a href="{% url 'office_rental_list' %}" class="btn btn-secondary">Quay lại</a>
      <button class="btn btn-primary">Lưu</button>
    </div>
  </form>
</div>

{% endblock %}
