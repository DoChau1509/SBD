{% extends 'base.html' %}
{% block content %}

<div class="container" style="margin-top:100px; max-width:700px;">
  <h2>{% if item %}Sửa{% else %}Thêm{% endif %} nội dung {{ service_config.title|lower }}</h2>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="text" name="title" value="{{ item.title|default:'' }}" placeholder="Tiêu đề" class="form-control mb-2" required>
    <textarea name="summary" class="form-control mb-2" rows="3" placeholder="Mô tả ngắn">{{ item.summary|default:'' }}</textarea>
    <textarea name="content" class="form-control mb-2" rows="10" placeholder="Nội dung chi tiết" required>{{ item.content|default:'' }}</textarea>
    {% include "includes/gallery_form_field.html" with instance=item %}

    <div class="d-flex justify-content-between align-items-center mt-3">
      <a href="{% url service_config.list_url_name %}" class="btn btn-secondary">Quay lại</a>
      <button class="btn btn-primary">Lưu</button>
    </div>
  </form>
</div>

{% endblock %}
