{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding: 40px 15px; max-width: 900px;">
    <h2>Chỉnh sửa Hero Section</h2>
    <form method="POST">
        {% csrf_token %}

        <h5 style="margin: 24px 0 12px; color: #1a3a5c; border-bottom: 2px solid #c9a84c; padding-bottom: 6px;">Nội dung văn bản</h5>
        <div class="form-group">
            <label>Badge text</label>
            <input type="text" name="badge_text" class="form-control" value="{{ hero.badge_text|default:'' }}">
        </div>
        <div class="form-group">
            <label>Tiêu đề dòng 1 (trắng)</label>
            <input type="text" name="heading_line1" class="form-control" value="{{ hero.heading_line1|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Tiêu đề dòng 2 (vàng) <small class="text-muted">— để trống nếu không cần</small></label>
            <input type="text" name="heading_line2" class="form-control" value="{{ hero.heading_line2|default:'' }}">
        </div>
        <div class="form-group">
            <label>Mô tả</label>
            <textarea name="description" class="form-control" rows="3">{{ hero.description|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label>Theme màu chữ cho hero</label>
            <select name="text_theme" class="form-control">
                {% for value, label in text_theme_choices %}
                <option value="{{ value }}" {% if hero.text_theme|default:'light' == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <small class="form-text text-muted">Dùng chữ sáng cho nền tối, và chữ tối cho nền sáng.</small>
        </div>
        <div class="form-row">
            <div class="form-group col-md-6">
                <label>Nút chính — text</label>
                <input type="text" name="btn_primary_text" class="form-control" value="{{ hero.btn_primary_text|default:'Giới Thiệu' }}">
            </div>
            <div class="form-group col-md-6">
                <label>Nút chính — URL</label>
                <input type="text" name="btn_primary_url" class="form-control" value="{{ hero.btn_primary_url|default:'/about/' }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group col-md-6">
                <label>Nút phụ — text</label>
                <input type="text" name="btn_outline_text" class="form-control" value="{{ hero.btn_outline_text|default:'Xem Dự Án' }}">
            </div>
            <div class="form-group col-md-6">
                <label>Nút phụ — URL</label>
                <input type="text" name="btn_outline_url" class="form-control" value="{{ hero.btn_outline_url|default:'/project/' }}">
            </div>
        </div>

        <h5 style="margin: 24px 0 12px; color: #1a3a5c; border-bottom: 2px solid #c9a84c; padding-bottom: 6px;">Thống kê</h5>
        <div class="form-row">
            <div class="form-group col-md-3"><label>Số 1</label><input type="text" name="stat_1_num" class="form-control" value="{{ hero.stat_1_num|default:'500+' }}"></div>
            <div class="form-group col-md-3"><label>Nhãn 1</label><input type="text" name="stat_1_label" class="form-control" value="{{ hero.stat_1_label|default:'Dự án hoàn thành' }}"></div>
            <div class="form-group col-md-3"><label>Số 2</label><input type="text" name="stat_2_num" class="form-control" value="{{ hero.stat_2_num|default:'15+' }}"></div>
            <div class="form-group col-md-3"><label>Nhãn 2</label><input type="text" name="stat_2_label" class="form-control" value="{{ hero.stat_2_label|default:'Năm kinh nghiệm' }}"></div>
        </div>
        <div class="form-row">
            <div class="form-group col-md-3"><label>Số 3</label><input type="text" name="stat_3_num" class="form-control" value="{{ hero.stat_3_num|default:'200+' }}"></div>
            <div class="form-group col-md-3"><label>Nhãn 3</label><input type="text" name="stat_3_label" class="form-control" value="{{ hero.stat_3_label|default:'Kỹ sư & Chuyên gia' }}"></div>
            <div class="form-group col-md-3"><label>Số 4</label><input type="text" name="stat_4_num" class="form-control" value="{{ hero.stat_4_num|default:'98%' }}"></div>
            <div class="form-group col-md-3"><label>Nhãn 4</label><input type="text" name="stat_4_label" class="form-control" value="{{ hero.stat_4_label|default:'Khách hàng hài lòng' }}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Xem Trang Chủ</a>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Quay lại Dashboard</a>
    </form>
</div>
{% endblock %}
