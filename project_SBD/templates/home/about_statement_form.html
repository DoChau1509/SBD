{% extends 'base.html' %} {% block content %}
<div class="container" style="margin-top: 100px">
  <h2>{{ title }}</h2>

  <form method="POST">
    {% csrf_token %}

    <div class="form-group">
      <label>Loại nội dung *</label>
      <select name="statement_type" class="form-control" required>
        <option value="">-- Chọn loại --</option>
        <option
          value="vision"
          {%
          if
          statement.statement_type=""
          ="vision"
          %}selected{%
          endif
          %}
        >
          Tầm nhìn
        </option>
        <option
          value="mission"
          {%
          if
          statement.statement_type=""
          ="mission"
          %}selected{%
          endif
          %}
        >
          Sứ mệnh
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Tiêu đề *</label>
      <input
        type="text"
        name="title"
        class="form-control"
        value="{{ statement.title|default:'' }}"
        required
      />
    </div>

    <div class="form-group">
      <label>Nội dung *</label>
      <textarea name="content" class="form-control" rows="6" required>
{{ statement.content|default:'' }}</textarea
      >
    </div>

    <div class="form-group">
      <label>Icon Font Awesome</label>
      <input
        type="text"
        name="icon"
        class="form-control"
        value="{{ statement.icon|default:'fa-star' }}"
        placeholder="Ví dụ: fa-eye hoặc fa-rocket"
      />
      <small class="form-text text-muted"
        >Chỉ nhập phần class icon, ví dụ: fa-eye, fa-rocket, fa-heart</small
      >
    </div>

    <div class="form-group">
      <label>Thứ tự hiển thị</label>
      <input
        type="number"
        name="order"
        class="form-control"
        value="{{ statement.order|default:'0' }}"
        min="0"
      />
    </div>

    <div class="form-group form-check">
      <input
        type="checkbox"
        name="is_active"
        class="form-check-input"
        id="is_active_statement"
        {%
        if
        statement.is_active
        or
        not
        statement
        %}checked{%
        endif
        %}
      />
      <label class="form-check-label" for="is_active_statement"
        >Hiển thị trên website</label
      >
    </div>

    <button type="submit" class="btn btn-primary">Lưu</button>
    <a href="{% url 'statement_list' %}" class="btn btn-secondary">Hủy</a>
  </form>
</div>
{% endblock %}
