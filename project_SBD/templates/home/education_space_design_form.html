{% extends 'base.html' %}
{% block content %}

<div class="container" style="margin-top:100px; max-width:700px;">
  <h2>{% if education_space_design %}Sửa{% else %}Thêm{% endif %} nội dung thiết kế không gian giáo dục</h2>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="text" name="title" value="{{ education_space_design.title|default:'' }}" placeholder="Tiêu đề" class="form-control mb-2" required>

    <textarea name="summary" class="form-control mb-2" rows="3" placeholder="Mô tả ngắn">{{ education_space_design.summary|default:'' }}</textarea>

    <textarea name="content" class="form-control mb-2" rows="10" placeholder="Nội dung chi tiết" required>{{ education_space_design.content|default:'' }}</textarea>

    {% include "includes/gallery_form_field.html" with instance=education_space_design %}

    <div class="d-flex justify-content-between align-items-center mt-3">
      <a href="{% url 'education_space_design_list' %}" class="btn btn-secondary">Quay lại</a>
      <button class="btn btn-primary">Lưu</button>
    </div>
  </form>
</div>

{% endblock %}
