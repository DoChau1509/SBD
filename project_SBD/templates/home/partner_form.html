{% extends 'base.html' %}
{% block content %}

<div class="container" style="margin-top: 100px; max-width: 900px">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="mb-0">{{ title_page }}</h2>
    <a href="{% url 'partner_list' %}" class="btn btn-secondary">Quay lại</a>
  </div>

  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-group mb-3">
      <label>Tên đối tác *</label>
      <input
        type="text"
        name="name"
        class="form-control"
        value="{{ partner.name|default:'' }}"
        placeholder="Ví dụ: Vietcombank"
        required
      />
    </div>

    <div class="form-group mb-3">
      <label>Logo</label>
      <input type="file" name="logo" class="form-control" accept="image/*" />
      {% if partner.logo %}
      <div class="mt-2">
        <img src="{{ partner.logo.url }}" alt="{{ partner.name }}" style="max-width: 160px; max-height: 80px; object-fit: contain" />
      </div>
      {% endif %}
    </div>

    <div class="form-group mb-3">
      <label>Website</label>
      <input
        type="url"
        name="website_url"
        class="form-control"
        value="{{ partner.website_url|default:'' }}"
        placeholder="https://example.com"
      />
    </div>

    <div class="form-group mb-3">
      <label>Thứ tự hiển thị</label>
      <input
        type="number"
        name="order"
        class="form-control"
        value="{{ partner.order|default:'0' }}"
        min="0"
      />
    </div>

    <div class="form-group form-check mb-4">
      <input
        type="checkbox"
        name="is_active"
        class="form-check-input"
        id="is_active_partner"
        {% if partner.is_active or not partner %}checked{% endif %}
      />
      <label class="form-check-label" for="is_active_partner">
        Hiển thị ở trang chủ
      </label>
    </div>

    <button type="submit" class="btn btn-primary">Lưu</button>
    <a href="{% url 'partner_list' %}" class="btn btn-secondary">Hủy</a>
  </form>
</div>

{% endblock %}
