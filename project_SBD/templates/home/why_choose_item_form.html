{% extends 'base.html' %} {% block content %}
<div class="container" style="margin-top: 100px; max-width: 800px">
  <h2>{{ title_page }}</h2>

  <form method="POST">
    {% csrf_token %}

    <input
      type="text"
      name="title"
      class="form-control mb-3"
      value="{{ item.title|default:'' }}"
      placeholder="Tiêu đề"
    />

    <textarea
      name="content"
      class="form-control mb-3"
      rows="4"
      placeholder="Nội dung"
    >
{{ item.content|default:'' }}</textarea
    >

    <input
      type="text"
      name="icon"
      class="form-control mb-3"
      value="{{ item.icon|default:'fa-solid fa-star' }}"
      placeholder="Ví dụ: fa fa-trophy"
    />

    <input
      type="number"
      name="order"
      class="form-control mb-3"
      value="{{ item.order|default:0 }}"
      placeholder="Thứ tự"
    />

    <div class="form-check mb-3">
      <input
        type="checkbox"
        name="is_active"
        class="form-check-input"
        id="is_active"
        {%
        if
        item.is_active
        or
        not
        item
        %}checked{%
        endif
        %}
      />
      <label class="form-check-label" for="is_active">Hiển thị</label>
    </div>

    <div class="d-flex justify-content-between">
      <a href="{% url 'why_choose_item_list' %}" class="btn btn-secondary"
        >Quay lại</a
      >
      <button type="submit" class="btn btn-primary">Lưu</button>
    </div>
  </form>
</div>
{% endblock %}
